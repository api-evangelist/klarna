aid: klarna
url: https://raw.githubusercontent.com/api-evangelist/klarna/refs/heads/main/apis.yml
name: Klarna
kind: company
description: >-
  Klarna Bank AB is a Swedish licensed bank and payments network serving 150M+ consumers and
  600k+ merchants with buy-now-pay-later, financing, cards, banking and a shopping app. For
  developers Klarna publishes a merchant API estate covering payment sessions and authorization
  (Klarna Payments), hosted checkout (Klarna Checkout and the Hosted Payment Page), post-purchase
  order management (capture, refund, cancel, extend due date), customer tokens for recurring
  purchases, settlement payouts and transaction reporting, the Merchant Card Service, and a PSD2
  XS2A open-banking API for licensed TPPs. Authentication is HTTP Basic with a Klarna-issued API
  key; Sign in with Klarna adds a full OAuth 2.0 / OpenID Connect consumer-identity surface.
  Klarna publishes rate limits, a six-month deprecation policy, public service-level objectives,
  a self-serve playground with market-specific sample data, and an llms.txt — but no fetchable
  OpenAPI, no server-side SDK in any language, and no MCP server.
