state_machine:
  order:
    - {from: null, to: AUTHORIZED, via: createOrder}
    - {from: AUTHORIZED, to: PART_CAPTURED, via: captureOrder (partial)}
    - {from: AUTHORIZED, to: CAPTURED, via: captureOrder (full)}
    - {from: PART_CAPTURED, to: CAPTURED, via: captureOrder}
    - {from: AUTHORIZED, to: CANCELLED, via: cancelOrder, condition: only while no capture exists}
    - {from: AUTHORIZED, to: EXPIRED, via: authorization expiry}
    - {from: CAPTURED, to: CLOSED, via: settlement}
  note: >-
    Derived from the error-code documentation's stated transition rules
    (CAPTURE_NOT_ALLOWED, CANCEL_NOT_ALLOWED, REFUND_NOT_ALLOWED), not from a Klarna-published
    state diagram. Klarna publishes no formal state machine document.

