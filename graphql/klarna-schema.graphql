  description: String
  intendedUse: String
}

input RegisterWebhookInput {
  url: URL!
  eventTypes: [WebhookEventType!]!
  secret: String
}

# ─── Root Types ──────────────────────────────────────────────────────────────

type Query {
  "Retrieve a payment session by ID."
  session(id: ID!): Session

  "Retrieve an authorization by token."
  authorization(token: String!): Authorization

  "Retrieve an order by Klarna order ID."
  order(id: ID!): Order

  "List orders for a merchant with optional filters."
  orders(
    merchantId: ID!
    status: OrderStatus
    fromDate: String
    toDate: String
    limit: Int
    offset: Int
  ): [Order!]

  "Retrieve a capture by ID."
  capture(orderId: ID!, captureId: ID!): Capture

  "List captures for an order."
  captures(orderId: ID!): [Capture!]

  "Retrieve a refund by ID."
  refund(orderId: ID!, refundId: ID!): Refund

  "List refunds for an order."
  refunds(orderId: ID!): [Refund!]

  "Retrieve a customer token."
  customerToken(tokenId: ID!): CustomerToken

  "Retrieve merchant information."
  merchant(merchantId: ID!): Merchant

  "List settlement reports for a merchant."
  settlements(
    merchantId: ID!
    startDate: String
    endDate: String
    settlementType: SettlementType
    limit: Int
    offset: Int
  ): [Settlement!]

  "Retrieve a single settlement."
  settlement(settlementId: ID!): Settlement

  "List payouts for a merchant."
  payouts(merchantId: ID!, startDate: String, endDate: String): [Payout!]

  "Retrieve a payout."
  payout(payoutId: ID!): Payout

  "List disputes for a merchant."
  disputes(merchantId: ID!, status: DisputeStatus): [Dispute!]

  "Retrieve a dispute."
  dispute(disputeId: ID!): Dispute

  "List chargebacks for a merchant."
  chargebacks(merchantId: ID!): [Chargeback!]

  "List registered webhooks."
  webhooks(merchantId: ID!): [Webhook!]

  "Retrieve a single webhook."
  webhook(webhookId: ID!): Webhook

  "List recent webhook events."
  webhookEvents(webhookId: ID!, limit: Int): [WebhookEvent!]

  "List API keys for a merchant."
  apiKeys(merchantId: ID!): [APIKey!]
}

type Mutation {
  "Create a new Klarna payment session."
  createSession(input: CreateSessionInput!): Session!

  "Update an existing payment session."
  updateSession(sessionId: ID!, input: CreateSessionInput!): Session!

  "Authorize an order against a session."
  authorizeOrder(sessionId: ID!, input: AuthorizationInput!): AuthorizationDetails!

  "Create a Klarna order from an authorization token."
  createOrder(input: CreateOrderInput!): Order!

  "Acknowledge a Checkout order (required within 10 minutes)."
  acknowledgeOrder(orderId: ID!): Boolean!

  "Capture a full or partial order amount."
  captureOrder(orderId: ID!, input: CaptureInput!): Capture!

  "Refund a captured order."
  refundCapture(orderId: ID!, captureId: ID!, input: RefundInput!): Refund!

  "Cancel an authorized but uncaptured order."
  cancelOrder(orderId: ID!): Boolean!

  "Extend the authorization period of an order."
  extendAuthorization(orderId: ID!): DateTime

  "Update shipping on a capture."
  updateShipping(orderId: ID!, captureId: ID!, shippingInfo: [ShippingInput!]!): Capture!

  "Create a customer token from an authorization."
  createCustomerToken(authorizationToken: String!, input: CustomerTokenInput!): CustomerToken!

  "Create an order using a customer token (recurring)."
  createTokenOrder(tokenId: ID!, input: CreateOrderInput!): Order!

  "Register a new webhook endpoint."
  registerWebhook(merchantId: ID!, input: RegisterWebhookInput!): Webhook!

  "Update an existing webhook."
  updateWebhook(webhookId: ID!, input: RegisterWebhookInput!): Webhook!

  "Delete a webhook."
  deleteWebhook(webhookId: ID!): Boolean!
}
