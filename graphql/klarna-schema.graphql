  givenName: String
  familyName: String
  email: String
  phone: String
  streetAddress: String
  streetAddress2: String
  postalCode: String
  city: String
  region: String
  country: String!
  title: String
  attentionName: String
  organizationName: String
}

type ShippingAddress {
  givenName: String
  familyName: String
  email: String
  phone: String
  streetAddress: String
  streetAddress2: String
  postalCode: String
  city: String
  region: String
  country: String!
  title: String
  attentionName: String
  organizationName: String
