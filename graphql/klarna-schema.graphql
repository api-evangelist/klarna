# ─── Discount Types ──────────────────────────────────────────────────────────

type PromotionCode {
  code: String!
  description: String
  type: String
}

type DiscountDetails {
  title: String
  description: String
  discountType: String
  promotionCode: PromotionCode
}

type Discount {
