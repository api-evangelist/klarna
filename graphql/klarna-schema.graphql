"""
Klarna Payments and BNPL GraphQL Schema
Covers: payment sessions, authorizations, order management,
customer tokens, settlements, disputes, and webhooks.
Source: https://docs.klarna.com/
"""

# ─── Scalars ────────────────────────────────────────────────────────────────

scalar DateTime
scalar JSON
scalar URL

# ─── Enums ──────────────────────────────────────────────────────────────────

enum SessionStatus {
  INCOMPLETE
  COMPLETE
  DISABLED
}

enum OrderStatus {
  AUTHORIZED
  PART_CAPTURED
  CAPTURED
  CANCELLED
  EXPIRED
  CLOSED
}

enum ItemType {
  PHYSICAL
  DIGITAL
  SHIPPING_FEE
  SALES_TAX
  DISCOUNT
  STORE_CREDIT
  GIFT_CARD
  SURCHARGE
}

enum PaymentMethodType {
  INVOICE
  DIRECT_DEBIT
  DIRECT_BANK_TRANSFER
  CARD
  PAYLATER
  SLICE_IT
  SLICE_IT_BY_CARD
  PAY_NOW
  PAY_OVER_TIME
}

enum DisputeStatus {
  OPEN
  PENDING_EVIDENCE
  RESOLVED
  LOST
  WON
}

enum SettlementType {
  INVOICE
  CREDIT_NOTE
  CORRECTION
}

enum FraudStatus {
  ACCEPTED
  PENDING
  REJECTED
}

enum CustomerTokenStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
}

enum WebhookEventType {
  ORDER_CAPTURED
  ORDER_CANCELLED
  ORDER_REFUNDED
  SESSION_CREATED
  SESSION_COMPLETED
  DISPUTE_OPENED
  DISPUTE_RESOLVED
  CHARGEBACK_CREATED
  SETTLEMENT_CREATED
  CUSTOMER_TOKEN_CREATED
}

