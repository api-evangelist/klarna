# ─── Image and URL Types ─────────────────────────────────────────────────────

type ImageURL {
  url: URL!
  width: Int
  height: Int
  altText: String
}

type AssetURLs {
  descriptive: URL
  standard: URL
}

# ─── Line Item Types ─────────────────────────────────────────────────────────

