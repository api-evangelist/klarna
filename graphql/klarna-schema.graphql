  monthlyAmount: Int!
  firstInstallmentAmount: Int
  lastInstallmentAmount: Int
  totalAmount: Int!
  totalInterestAmount: Int
  startDate: String
}

type Plan {
  planId: ID!
  name: String!
  monthlyAmount: Int!
  numberOfInstallments: Int!
  totalAmount: Int!
  interestRate: InterestRate
}

type PaymentPlan {
  paymentPlanId: ID!
  planType: String!
  installmentDetails: InstallmentDetails
  interestRate: InterestRate
  plans: [Plan!]
}

type FinancingOption {
  financingOptionId: ID!
  label: String!
  description: String
  startFee: Int
  monthlyFee: Int
  interestRate: InterestRate
  numberOfInstallments: Int
  totalAmount: Int
