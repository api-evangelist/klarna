  shippingAddress: ShippingAddressInput
  merchantReference1: String
  merchantReference2: String
  merchantData: String
  customPaymentMethodIds: [String!]
  options: JSON
}

input CustomerDetailsInput {
  givenName: String
  familyName: String
  email: String
  phone: String
  dateOfBirth: String
  vatId: String
  type: String
}

input AuthorizationInput {
  autoFinalize: Boolean
  billingAddress: BillingAddressInput
  shippingAddress: ShippingAddressInput
  customer: CustomerDetailsInput
  orderLines: [LineItemInput!]
  orderAmount: Int
  orderTaxAmount: Int
