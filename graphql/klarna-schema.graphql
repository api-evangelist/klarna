  locale: String!
  orderAmount: Int!
  orderTaxAmount: Int
  orderLines: [LineItemInput!]!
  billingAddress: BillingAddressInput
  shippingAddress: ShippingAddressInput
  merchantReference1: String
  merchantReference2: String
  merchantData: String
}

input CaptureInput {
  capturedAmount: Int!
  description: String
  orderLines: [LineItemInput!]
  shippingInfo: [ShippingInput!]
}

input ShippingInput {
  shippingCompany: String
  shippingMethod: String
  trackingNumber: String
  trackingUri: String
  returnShippingCompany: String
  returnTrackingNumber: String
  returnTrackingUri: String
}

input RefundInput {
  refundedAmount: Int!
  description: String
  orderLines: [LineItemInput!]
  merchantReference: String
}

input CustomerTokenInput {
  purchaseCountry: String!
  purchaseCurrency: String!
  locale: String!
  billingAddress: BillingAddressInput!
