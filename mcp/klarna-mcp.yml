description: 'Klarna publishes NO MCP server. Searched 2026-08-27: no server in Klarna''s own documentation,
  no @klarna scoped MCP package on npm, no mcp.klarna.com host (DNS does not resolve), and no reference
  to Model Context Protocol anywhere in Klarna''s 79 KB llms.txt. The only Klarna MCP servers in circulation
  are third-party auto-generations from the Klarna Payments spec (e.g. github.com/ag2-mcp-servers/klarna-payments-api-v1)
  and are NOT operated by Klarna. The tools below are a CANDIDATE surface derived from the OpenAPI in
  this repo, one tool per real operationId, so an agent builder has a starting point. Nobody ships this
  server.'
