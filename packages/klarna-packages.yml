method: searched
source: >-
  npm registry (registry.npmjs.org), Packagist (repo.packagist.org), pub.dev,
  CocoaPods trunk, Klarna's own Maven repository at x.klarnacdn.net/mobile-sdk,
  and the Klarna GitHub organization at https://github.com/klarna
description: >-
  First-party Klarna client libraries. Klarna publishes NO server-side REST SDK for the
  Payments / Order Management / Settlements APIs in any language — the only maintained
  first-party libraries are the mobile (Android / iOS / React Native / Flutter) in-app SDKs
  and browser-loaded JavaScript libraries served from Klarna's own CDN. The one historical
  server-side SDK, the PHP klarna/kco_rest library, is marked ABANDONED on Packagist and
  its GitHub repository is archived as [DEPRECATED].
