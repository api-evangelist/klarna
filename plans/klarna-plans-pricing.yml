description: >-
  Klarna does not publish a developer plan ladder — there is no free tier, no metered API pricing
  and no self-serve API price page. Klarna monetizes the merchant transaction, not API access. The
  numbers below come from Klarna's own published Pricing Annex PDF for merchants in the United
  States and Canada, which forms part of the merchant Cooperation Agreement. API keys are issued
  from the Merchant Portal once a merchant is contracted; the playground environment is free and
  self-serve.
plan_count: 1
pricing_model: per-transaction merchant service charge (no API-usage pricing)
plans:
  - id: klarna-payments-merchant
    name: Klarna Payments — merchant service charges
    type: transactional
    description: >-
      Variable fee plus a fixed per-transaction fee. The currency of the fixed fee is set by the
      country the shopper is in, not the merchant's country of registration. The variable fee is
      calculated on the total amount of the Claim including sales tax.
    source: https://x.klarnacdn.net/mepo/onboarding/pricing-annexes/pricing-annex-kp-CA-US-en-20230905.pdf
    entries:
      - label: Variable fee
        name: variable_fee
        type: percentage
        metric: transaction
        price: 5.99
        unit: percent
        timeFrame: transaction
        geo: US/CA pricing annex
      - {label: Fixed fee, name: fixed_fee_usd, type: flat, price: 0.30, currency: USD, metric: transaction, geo: United States}
      - {label: Fixed fee, name: fixed_fee_cad, type: flat, price: 0.40, currency: CAD, metric: transaction, geo: Canada}
      - {label: Fixed fee, name: fixed_fee_aud_nzd, type: flat, price: 0.55, currency: AUD/NZD, metric: transaction, geo: Australia, New Zealand}
      - {label: Fixed fee, name: fixed_fee_nok_sek, type: flat, price: 3.50, currency: NOK/SEK, metric: transaction, geo: Norway, Sweden}
      - {label: Fixed fee, name: fixed_fee_dkk, type: flat, price: 2.50, currency: DKK, metric: transaction, geo: Denmark}
      - {label: Fixed fee, name: fixed_fee_eur, type: flat, price: 0.35, currency: EUR, metric: transaction, geo: 'Austria, Belgium, Finland, France, Germany, Greece, Ireland, Italy, Netherlands, Portugal, Spain'}
      - {label: Fixed fee, name: fixed_fee_chf, type: flat, price: 0.35, currency: CHF, metric: transaction, geo: Switzerland}
      - {label: Fixed fee, name: fixed_fee_gbp, type: flat, price: 0.30, currency: GBP, metric: transaction, geo: United Kingdom}
      - {label: Fixed fee, name: fixed_fee_pln, type: flat, price: 1.50, currency: PLN, metric: transaction, geo: Poland}
      - {label: Fixed fee, name: fixed_fee_czk, type: flat, price: 8.50, currency: CZK, metric: transaction, geo: Czech Republic}
    elements:
      - name: Cross-Border Fee
        description: >-
          Klarna reserves the right to charge an additional percentage fee on cross-border
          transactions where the merchant sells outside its own market or region. The rate is not
          fixed in the published annex.
      - name: No monthly or sign-up fee
        description: The published annex states service charges only; there is no listed platform or setup fee.
      - name: Negotiated rates
        description: >-
          Klarna's annexes are per-agreement documents. Enterprise merchants contract rates
          individually; the published annex is the standard US/CA schedule as of 2023-09-05.
free_tier:
  available: true
  name: Playground
  url: https://portal.playground.klarna.com
  description: >-
    Self-serve playground sign-up with test API keys and no transaction fees — Klarna states live
    systems do not process playground purchases and no invoices or fees result. Production access
    requires a signed Cooperation Agreement.
notes: >-
  Klarna has no public /pricing page for its APIs. www.klarna.com/us/business/pricing/ 302s to the
  enterprise page, which itself 404s as of 2026-08-27; the only machine-fetchable published pricing
  is the CDN-hosted Pricing Annex PDF above (HTTP 200, 38 KB, probed 2026-08-27). The annex is dated
  2023-09-05 and may not reflect current negotiated rates.
