notes:
  - >-
    docs.klarna.com answers 404 for unknown paths with a 63 KB HTML shell (its Next.js 404
    page), so every miss there is a genuine 404 status, not a soft-200 catch-all.
  - >-
    www.klarna.com answers /.well-known/* misses with an application/xml 404 body of ~300
    bytes; api.klarna.com answers with a 57-byte application/json 404. Neither is a catch-all.
  - >-
